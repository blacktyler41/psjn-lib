{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="icon" href="{% static 'logo.JPG' %}" type="image/gif" sizes="16x16">
    <title>Quiz List</title>

</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'student_dashboard' %}"><img src="{% static 'Codex_logo.jpeg' %}" alt="Logo" width="70" height="70" class="d-inline-block rounded-circle"></a>
            
            <!-- CTA Button -->
            
            <a href="{% url 'logout' %}" class="btn btn-danger">Logout</a>
        </div>
    </div>
</nav>

    <!--Django section-->
    <h1 class="text-center p-3">Available Quizzes</h1>

    <figure class="text-center p-3">
      <blockquote class="blockquote">
        <p>Success consists of going from failure to failure without loss of enthusiasm</p>
      </blockquote>
      <figcaption class="blockquote-footer">
        Winston Churchill, <cite title="Source Title">Former British Prime Minister</cite>
      </figcaption>
    </figure>
     
    
        <div class="container">
          <div class="row">
            <div class="col order-last ">
              {% for quiz in quizzes %}
              <div class="card">
                <h5 class="card-header">{{ quiz.title }}</h5>
                <div class="card-body">
                  <h5 class="card-title">Get ready for {{ quiz.title }} test </h5>
                  <p class="card-text">Goodluck for this {{ quiz.title }}  test.</p>
                  <a href="{% url 'quiz_detail' quiz.pk %}" class="btn btn-info align-middle">Take test</a>
                </div>
              </div>
                

              {% endfor %}
            </div>
          </div>
        </div>
<!--Back-->
        <div class="d-grid gap-2 col-6 mx-auto p-5 justify-content-center align-items-center">
          <a href="{% url 'student_dashboard' %} " class="text-white "><button class="btn btn-success px-5 align-text-bottom" type="button">Back</button></a>
        </div>
    
    <!--Translator-->
<div class="gtranslate_wrapper"></div>
<script>window.gtranslateSettings = {"default_language":"en","detect_browser_language":true,"languages":["en","fr","de","it","es","hi","ar","zh-CN","ru","af","sw","ur","am","xh"],"wrapper_selector":".gtranslate_wrapper","flag_size":16,"switcher_horizontal_position":"right","switcher_vertical_position":"bottom","flag_style":"3d","alt_flags":{"en":"usa"},"switcher_text_color":"#f7f7f7","switcher_arrow_color":"#f2f2f2","switcher_border_color":"#161616","switcher_background_color":"#303030","switcher_background_shadow_color":"#474747","switcher_background_hover_color":"#3a3a3a","dropdown_text_color":"#eaeaea","dropdown_hover_color":"#748393","dropdown_background_color":"#474747"}</script>
<script src="https://cdn.gtranslate.net/widgets/latest/dwf.js" defer></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
