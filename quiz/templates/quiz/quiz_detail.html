
    
    {% load static %}
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Student_Dashboard</title>
        <!-- Bootstrap CSS -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
        <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="{% static 'user.css' %}">
        <link rel="icon" href="{% static 'logo.JPG' %}" type="image/gif" sizes="16x16">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
    
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'student_dashboard' %}"><img src="{% static 'Codex_logo.jpeg' %}" alt="Logo" width="70" height="70" class="d-inline-block rounded-circle"></a>
      

                <!-- CTA Button -->
                <a href="{% url 'logout' %}" class="btn btn-danger">Logout</a>
            </div>
        </div>
    </nav>
    <!--Where to take  quizzes-->
    <h1 class="text-center p-3">{{ quiz.title }}</h1>
    <p class="text-center">{{ quiz.text }}</p>
   <div class="p-5">
    <form method="post">
        {% csrf_token %}
        <ol>
        {% for question in quiz.questions.all %}
       
        <li><h5>{{ question.text }}</h5>
            {% for answer in question.answers.all %}
        </li>
       
       <label>
           <input type="radio" name="{{ question.id }}" value="{{ answer.id }}">
            {{ answer.text }}
       </label><br>
        {% endfor %}
   
         {% endfor %}
        </ol>
        <div class="text-center p-4">
          <button type="submit" class="btn btn-outline-info">Submit</button>
        </div>
    </form>
   </div>
   <!--Translator-->
<div class="gtranslate_wrapper"></div>

<script src="https://cdn.gtranslate.net/widgets/latest/dwf.js" defer></script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
    </html>
