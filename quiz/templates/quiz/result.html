   {% load static %}
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Student_Dashboard</title>
        <!-- Bootstrap CSS -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
        <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="{% static 'user.css' %}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="icon" href="{% static 'logo.JPG' %}" type="image/gif" sizes="16x16">
    </head>
    <body>
    
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'student_dashboard' %}"><img src="{% static 'Codex_logo.jpeg' %}" alt="Logo" width="70" height="70" class="d-inline-block rounded-circle"></a>
      

                <!-- CTA Button -->
                <a href="{% url 'logout' %}" class="btn btn-danger">Logout</a>
            </div>
        </div>
    </nav>
    <!--Where to take  quizzes-->
    <h1 class="text-center p-3">{{ quiz.title }} - Result</h1>
    <div class="py-10">
    <p class="text-center ">{{request.user.username}}, check your results below.</p>
    </div>
    
    <div class="container mt-5">
        <div class="card">
            <div class="card-header text-center bg-primary text-white">
                <h3>Student Result Slip</h3>
            </div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <p><strong>Student Name:</strong> {{request.user.username}}</p>
                        <p><strong>Exam:</strong> {{quiz.title}}</p>
                    </div>

                <table class="table table-bordered">
                    <thead class="table-dark">
                        <tr>
                            <th>Subject</th>
                            <th>Percentage</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>{{quiz.title}}</td>
                            <td>{{ percentage }}%</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
   
    <a href="{% url 'student_dashboard' %}" class="btn btn-info align-middle my-4">Back to dashboard</a>
    <!--Translator-->

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
