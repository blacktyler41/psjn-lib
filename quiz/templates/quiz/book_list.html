{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <link rel="stylesheet" href="{% static 'user.css' %}">
    <link rel="icon" href="{% static 'logo.JPG' %}" type="image/gif" sizes="16x16">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'student_dashboard' %}"><img src="{% static 'Codex_logo.jpeg' %}" alt="Logo" width="70" height="70" class="d-inline-block rounded-circle"></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'quiz_list' %}">Quizzes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'book_list' %}">Books</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle text-white" href="#" id="navbarDropdown" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        More
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="{% url 'dev' %}">Devellopers</a></li>
                        <li><a class="dropdown-item" href="#contact">Contact</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#testimonials">Testimony</a></li>
                    </ul>
                </li>
            </ul>
            
            <!-- CTA Button -->
            <a href="{% url 'logout' %}" class="btn btn-danger">Logout</a>
        </div>
    </div>
</nav>
<!--The book table-->
<!--<a href="{% url 'add_book' %}">Add a new book</a>-->


<div class="container mt-5">
    <table class="table table-bordered">
        <thead class="table-dark">
            <tr>
                <th>Book</th>
                <th>Click to open</th>
            </tr>
        </thead>
        <tbody>
        {% for book in books %} 
            <tr>
                <td>{{ book.title }}</td>
                <td><a href=" {{ book.Drive_link }}">Open book</a></td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
<!--Back-->
<div class="d-grid gap-2 col-6 mx-auto px-5 justify-content-center align-items-center">
    <a href="{% url 'student_dashboard' %} " class="text-white "><button class="btn btn-success px-5 align-text-bottom" type="button">Back</button></a>
  </div>
